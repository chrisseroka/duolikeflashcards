<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiszki - Duolingo Style</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <style>
        * { box-sizing: border-box; font-family: 'din-round', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background-color: #ffffff; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            min-height: 100vh;
            color: #4b4b4b;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        /* Ekran wyboru sekcji */
        .sections-header {
            font-size: 28px;
            font-weight: 800;
            color: #3c3c3c;
            margin: 20px 0 10px 0;
            text-align: center;
        }

        .sections-subtitle {
            font-size: 16px;
            color: #777;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }

        .sections-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .section-card {
            background-color: #ffffff;
            border: 2.5px solid #e5e5e5;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 0 #e5e5e5;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
            width: 100%;
            outline: none;
        }

        .section-card:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #e5e5e5;
        }

        .section-badge {
            font-size: 14px;
            font-weight: 800;
            color: #1cb0f6;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 800;
            color: #3c3c3c;
        }

        .section-count {
            font-size: 13px;
            font-weight: 700;
            color: #afafaf;
            margin-top: 4px;
        }

        /* Górny pasek z postępem */
        .top-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 15px;
        }

        .close-btn {
            font-size: 24px;
            color: #afafaf;
            cursor: pointer;
            font-weight: bold;
            background: none;
            border: none;
            padding: 0;
            line-height: 1;
        }

        .progress-container {
            flex-grow: 1;
            background-color: #e5e5e5;
            height: 16px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            background-color: #58cc02;
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .score-counter {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            color: #58cc02;
            font-size: 18px;
        }

        .score-icon {
            width: 24px;
            height: 24px;
            background-color: #58cc02;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }

        /* Nagłówek zadania */
        .header-title {
            align-self: flex-start;
            font-size: 24px;
            font-weight: 800;
            color: #3c3c3c;
            margin: 10px 0 25px 0;
        }

        /* Stos fiszek */
        .card-stack {
            position: relative;
            width: 100%;
            max-width: 320px;
            height: 320px;
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }

        .card-stack::before, .card-stack::after {
            content: '';
            position: absolute;
            background: #ffffff;
            border: 2px solid #e5e5e5;
            border-radius: 32px;
            width: 90%;
            height: 100%;
        }

        .card-stack::before { top: -16px; width: 86%; }
        .card-stack::after { top: -8px; width: 93%; }

        .card {
            position: relative;
            z-index: 2;
            background: #ffffff;
            border: 3px solid #e5e5e5;
            border-radius: 36px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-shadow: 0 4px 0 #e5e5e5;
        }

        .prompt {
            font-size: 30px;
            font-weight: 800;
            color: #3c3c3c;
            text-align: center;
            line-height: 1.2;
        }

        .hint-text {
            font-size: 14px;
            color: #afafaf;
            margin-top: 15px;
            font-weight: 700;
        }

        /* Przyciski */
        .action-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: auto;
        }

        .buttons-row {
            display: flex;
            width: 100%;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }

        .mic-btn {
            flex: 1;
            height: 70px;
            background-color: #1cb0f6;
            border: none;
            border-radius: 20px;
            box-shadow: 0 5px 0 #1899d6;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
            outline: none;
        }

        .mic-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1899d6;
        }

        .mic-btn.retry {
            background-color: #ff9600;
            box-shadow: 0 5px 0 #ce7900;
        }

        .mic-btn.retry:active { box-shadow: 0 1px 0 #ce7900; }

        .mic-icon { width: 32px; height: 32px; fill: white; }

        .skip-btn {
            width: 70px;
            height: 70px;
            background-color: #ffffff;
            border: 2.5px solid #e5e5e5;
            border-radius: 20px;
            box-shadow: 0 5px 0 #e5e5e5;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
            outline: none;
        }

        .skip-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #e5e5e5;
        }

        .skip-icon { width: 28px; height: 28px; fill: #1cb0f6; }

        .type-answers-btn {
            background: none;
            border: none;
            color: #afafaf;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .feedback-message {
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            min-height: 24px;
        }

        .feedback-message.correct { color: #58cc02; }
        .feedback-message.incorrect { color: #ff4b4b; }
        .feedback-message.listening { color: #ff9600; }

        /* Widok końca */
        .score-card {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .score-percent {
            font-size: 64px;
            font-weight: 800;
            color: #58cc02;
            margin: 20px 0;
        }

        .restart-btn {
            width: 100%;
            height: 55px;
            background-color: #58cc02;
            border: none;
            border-radius: 16px;
            box-shadow: 0 5px 0 #46a302;
            color: white;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 1. Ekran wyboru sekcji -->
    <div class="container" id="sections-view">
        <div class="sections-header">Wybierz lekcję</div>
        <div class="sections-subtitle">Czego chcesz się dzisiaj nauczyć?</div>
        <div class="sections-list" id="sections-list"></div>
    </div>

    <!-- 2. Ekran rozwiązywania fiszek -->
    <div class="container hidden" id="quiz-view">
        <div class="top-bar">
            <button class="close-btn" id="exit-btn" title="Wyjdź do lekcji">✕</button>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="score-counter">
                <div class="score-icon">✓</div>
                <span id="score-count">0</span>
            </div>
        </div>

        <div class="header-title" id="lesson-title">Translate the words</div>

        <div class="card-stack">
            <div class="card">
                <div class="prompt" id="prompt-text">Wczytywanie...</div>
                <div class="hint-text" id="hint-text">Powiedz po angielsku</div>
            </div>
        </div>

        <div class="feedback-message" id="feedback"></div>

        <div class="action-area">
            <div class="buttons-row">
                <button class="mic-btn" id="mic-btn" title="Mów">
                    <svg class="mic-icon" viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
                <button class="skip-btn" id="skip-btn" title="Pomiń">
                    <svg class="skip-icon" viewBox="0 0 24 24">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                    </svg>
                </button>
            </div>

            <button class="type-answers-btn">TYPE MY ANSWERS</button>
        </div>
    </div>

    <!-- 3. Ekran podsumowania -->
    <div class="container hidden" id="score-view">
        <div class="score-card">
            <h1 style="font-size: 32px; font-weight: 800; color: #3c3c3c;">Lekcja ukończona!</h1>
            <p style="color: #777; font-weight: 700;">Twój wynik poprawności:</p>
            <div class="score-percent" id="score-percent">0%</div>
            <p id="score-details" style="color: #777; font-weight: 700; margin-bottom: 40px;"></p>
            <button class="restart-btn" id="restart-btn">Wybierz inną lekcję</button>
        </div>
    </div>

    <script>
        // Dane słówek podzielone na sekcje/lekcje
        const sectionsData = [
            {
                "sectionLabel": "LESSON 8.4",
                "sectionDescription": "Making arrangements / Umawianie się",
                "words": [
                    {"en": "Are you busy next Thursday?", "pl": "Czy jesteś zajęty w następny czwartek?"},
                    {"en": "I've got tickets for a basketball match.", "pl": "Mam bilety na mecz koszykówki."},
                    {"en": "Catch you later!", "pl": "Do zobaczenia później!"},
                    {"en": "I don't get it.", "pl": "Nie rozumiem."},
                    {"en": "See you!", "pl": "Do zobaczenia!"},
                    {"en": "go out with friends", "pl": "wychodzić z przyjaciółmi"},
                    {"en": "go to a party", "pl": "iść na przyjęcie"},
                    {"en": "go to a wedding", "pl": "iść na wesele"}
                ]
            },
            {
                "sectionLabel": "LESSON 8.5",
                "sectionDescription": "Daily routines & Life",
                "words": [
                    {"en": "aged 7-11", "pl": "w wieku 7-11 lat"},
                    {"en": "at midnight", "pl": "o północy"},
                    {"en": "explore", "pl": "eksplorować, odkrywać"},
                    {"en": "get ready for", "pl": "przygotować się do"},
                    {"en": "breakfast time", "pl": "czas na śniadanie"},
                    {"en": "brush your hair", "pl": "czesać włosy"},
                    {"en": "school uniform", "pl": "mundurek szkolny"}
                ]
            },
            {
                "sectionLabel": "LESSON 8.6",
                "sectionDescription": "Feelings & Personality",
                "words": [
                    {"en": "annoyed", "pl": "zdenerwowany, poirytowany"},
                    {"en": "annoying", "pl": "denerwujący, irytujący"},
                    {"en": "bored", "pl": "znudzony"},
                    {"en": "boring", "pl": "nudny"},
                    {"en": "embarrassed", "pl": "zawstydzony, zakłopotany"},
                    {"en": "excited", "pl": "podekscytowany"},
                    {"en": "frightened", "pl": "przerażony"},
                    {"en": "interested", "pl": "zainteresowany"},
                    {"en": "relaxed", "pl": "zrelaksowany"},
                    {"en": "tired", "pl": "zmęczony"},
                    {"en": "worried", "pl": "zmartwiony"},
                    {"en": "big-headed", "pl": "zarozumiały"},
                    {"en": "bossy", "pl": "despotyczny"},
                    {"en": "cheerful", "pl": "radosny"},
                    {"en": "friendly", "pl": "przyjazny"},
                    {"en": "hard-working", "pl": "pracowity"},
                    {"en": "helpful", "pl": "pomocny"},
                    {"en": "lazy", "pl": "leniwca"},
                    {"en": "polite", "pl": "uprzejmy"},
                    {"en": "selfish", "pl": "samolubny"}
                ]
            }
        ];

        // Synteza mowy
        function speakEnglish(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Dźwięki
        function playCorrectSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const notes = [880, 1108.73, 1318.51];
            const now = audioCtx.currentTime;

            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + index * 0.06);

                gain.gain.setValueAtTime(0, now + index * 0.06);
                gain.gain.linearRampToValueAtTime(0.3, now + index * 0.06 + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.06 + 0.4);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + index * 0.06);
                osc.stop(now + index * 0.06 + 0.4);
            });
        }

        function playFanfare() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const sequence = [
                { freq: 587.33, start: 0.00, duration: 0.10 },
                { freq: 739.99, start: 0.10, duration: 0.10 },
                { freq: 880.00, start: 0.20, duration: 0.10 },
                { freq: 1174.66, start: 0.32, duration: 0.60 }
            ];
            const now = audioCtx.currentTime;

            sequence.forEach(note => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(note.freq, now + note.start);

                gain.gain.setValueAtTime(0, now + note.start);
                gain.gain.linearRampToValueAtTime(0.3, now + note.start + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + note.start + note.duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + note.start);
                osc.stop(now + note.start + note.duration);
            });
        }

        // Algorytm Levenshteina
        function getSimilarityRatio(str1, str2) {
            const s1 = str1.toLowerCase().replace(/[^a-z0-9]/g, '');
            const s2 = str2.toLowerCase().replace(/[^a-z0-9]/g, '');
            
            if (s1 === s2) return 1.0;
            if (s1.length === 0 || s2.length === 0) return 0.0;

            const matrix = Array.from({ length: s2.length + 1 }, (_, i) => [i]);
            for (let j = 0; j <= s1.length; j++) matrix[0][j] = j;

            for (let i = 1; i <= s2.length; i++) {
                for (let j = 1; j <= s1.length; j++) {
                    const cost = s2[i - 1] === s1[j - 1] ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + cost
                    );
                }
            }

            const distance = matrix[s2.length][s1.length];
            const maxLength = Math.max(s1.length, s2.length);
            return (maxLength - distance) / maxLength;
        }

        // Stan aplikacji
        let activeSection = null;
        let currentPool = [];
        let currentIndex = 0;
        let correctCount = 0;
        let isFirstAttempt = true;

        // DOM
        const sectionsView = document.getElementById('sections-view');
        const sectionsList = document.getElementById('sections-list');
        const quizView = document.getElementById('quiz-view');
        const scoreView = document.getElementById('score-view');
        
        const progressBar = document.getElementById('progress-bar');
        const scoreCountElem = document.getElementById('score-count');
        const lessonTitleElem = document.getElementById('lesson-title');
        const promptElem = document.getElementById('prompt-text');
        const hintText = document.getElementById('hint-text');
        const feedbackElem = document.getElementById('feedback');
        const micBtn = document.getElementById('mic-btn');
        const skipBtn = document.getElementById('skip-btn');
        const exitBtn = document.getElementById('exit-btn');
        const scorePercentElem = document.getElementById('score-percent');
        const scoreDetailsElem = document.getElementById('score-details');
        const restartBtn = document.getElementById('restart-btn');

        // Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            recognition.onstart = () => {
                feedbackElem.className = "feedback-message listening";
                feedbackElem.innerText = "Słucham...";
                micBtn.disabled = true;
            };

            recognition.onresult = (event) => {
                const spokenText = event.results[0][0].transcript;
                evaluateAnswer(spokenText);
            };

            recognition.onerror = () => {
                feedbackElem.className = "feedback-message incorrect";
                feedbackElem.innerText = "Spróbuj ponownie wypowiedzieć odpowiedź.";
                micBtn.disabled = false;
            };

            recognition.onend = () => {
                micBtn.disabled = false;
            };
        }

        // Renderowanie listy sekcji
        function renderSectionsScreen() {
            sectionsView.classList.remove('hidden');
            quizView.classList.add('hidden');
            scoreView.classList.add('hidden');

            sectionsList.innerHTML = '';
            sectionsData.forEach((sec, index) => {
                const btn = document.createElement('button');
                btn.className = 'section-card';
                btn.innerHTML = `
                    <div class="section-badge">${sec.sectionLabel}</div>
                    <div class="section-title">${sec.sectionDescription || 'Słówka i zwroty'}</div>
                    <div class="section-count">${sec.words.length} słówek w zestawie</div>
                `;
                btn.addEventListener('click', () => startQuizForSection(index));
                sectionsList.appendChild(btn);
            });
        }

        function startQuizForSection(sectionIndex) {
            activeSection = sectionsData[sectionIndex];
            
            // Losujemy maks 10 słówek z wybranej sekcji
            const shuffled = [...activeSection.words].sort(() => 0.5 - Math.random());
            currentPool = shuffled.slice(0, Math.min(10, shuffled.length));
            
            currentIndex = 0;
            correctCount = 0;

            sectionsView.classList.add('hidden');
            quizView.classList.remove('hidden');
            scoreView.classList.add('hidden');

            lessonTitleElem.innerText = activeSection.sectionLabel;
            renderCard();
        }

        function renderCard() {
            const currentCard = currentPool[currentIndex];
            isFirstAttempt = true;

            progressBar.style.width = `${(currentIndex / currentPool.length) * 100}%`;
            scoreCountElem.innerText = correctCount;

            promptElem.innerText = currentCard.pl;
            hintText.innerText = "Powiedz po angielsku";
            feedbackElem.innerText = "";
            feedbackElem.className = "feedback-message";
            
            micBtn.className = "mic-btn";
            micBtn.disabled = false;
        }

        function evaluateAnswer(spokenText) {
            const currentCard = currentPool[currentIndex];
            const ratio = getSimilarityRatio(spokenText, currentCard.en);

            if (ratio >= 0.70) {
                if (isFirstAttempt) {
                    correctCount++;
                    scoreCountElem.innerText = correctCount;
                }
                
                playCorrectSound();
                feedbackElem.className = "feedback-message correct";
                feedbackElem.innerText = `Świetnie! "${spokenText}"`;
                micBtn.disabled = true;

                setTimeout(() => {
                    currentIndex++;
                    if (currentIndex < currentPool.length) {
                        renderCard();
                    } else {
                        finishSession();
                    }
                }, 1800);

            } else {
                isFirstAttempt = false;
                feedbackElem.className = "feedback-message incorrect";
                feedbackElem.innerText = `Usłyszano: "${spokenText}"`;

                speakEnglish(currentCard.en);

                setTimeout(() => {
                    hintText.innerText = `Powtórz: "${currentCard.en}"`;
                    micBtn.className = "mic-btn retry";
                    micBtn.disabled = false;
                }, 1400);
            }
        }

        function finishSession() {
            progressBar.style.width = `100%`;
            quizView.classList.add('hidden');
            scoreView.classList.remove('hidden');

            const percentage = Math.round((correctCount / currentPool.length) * 100);
            scorePercentElem.innerText = `${percentage}%`;
            scoreDetailsElem.innerText = `Poprawne odpowiedzi za pierwszym razem: ${correctCount} z ${currentPool.length}`;

            playFanfare();
        }

        // Listener events
        micBtn.addEventListener('click', () => {
            if (recognition) recognition.start();
        });

        skipBtn.addEventListener('click', () => {
            currentIndex++;
            if (currentIndex < currentPool.length) {
                renderCard();
            } else {
                finishSession();
            }
        });

        exitBtn.addEventListener('click', renderSectionsScreen);
        restartBtn.addEventListener('click', renderSectionsScreen);

        // Start
        renderSectionsScreen();
    </script>
</body>
</html>
