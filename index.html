<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiszki Angielsko-Polskie</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#007bff">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: white; border-radius: 16px; padding: 30px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; position: relative; }
        .progress { font-size: 14px; font-weight: 600; color: #6c757d; margin-bottom: 15px; }
        .prompt { font-size: 24px; font-weight: bold; color: #2d3748; margin: 20px 0; min-height: 60px; display: flex; align-items: center; justify-content: center; }
        .hint { font-size: 14px; color: #718096; margin-bottom: 20px; font-weight: 500; }
        button { background-color: #007bff; color: white; border: none; padding: 14px 28px; font-size: 18px; font-weight: 600; border-radius: 50px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3); outline: none; width: 100%; }
        button:active { transform: scale(0.97); }
        button:disabled { background-color: #cbd5e0; box-shadow: none; cursor: not-allowed; }
        button.retry-mode { background-color: #ff9900; box-shadow: 0 4px 12px rgba(255, 153, 0, 0.4); }
        .result { margin-top: 20px; font-size: 16px; font-weight: 600; min-height: 50px; }
        .result.correct { color: #28a745; }
        .result.incorrect { color: #dc3545; }
        .result.listening { color: #ff9900; }
        .score-percent { font-size: 48px; font-weight: bold; color: #007bff; margin: 15px 0; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card" id="quiz-card">
        <div class="progress" id="progress">Fiszka 1 z 10</div>
        <div class="prompt" id="prompt-text">Wczytywanie...</div>
        <div class="hint" id="hint-text">Powiedz odpowiedź w języku angielskim</div>
        <button id="mic-btn">🎤 Odpowiedz (Mów)</button>
        <div class="result" id="result-text"></div>
    </div>

    <div class="card hidden" id="score-card">
        <h2>Koniec serii!</h2>
        <p>Twój wynik za pierwsze podejście:</p>
        <div class="score-percent" id="score-percent">0%</div>
        <p id="score-details" style="color: #4a5568;"></p>
        <button id="restart-btn" style="margin-top: 20px;">Zagraj ponownie</button>
    </div>
